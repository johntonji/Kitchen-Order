name: order_receiving
description: "Order Receiving Application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.2.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  http: ^1.1.2
  provider: ^6.1.1
  expandable: ^5.0.1
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.9
  awesome_snackbar_content: ^0.1.3
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.0
  dropdown_button2: ^2.3.9
  awesome_notifications: ^0.9.2
  bottom_picker: ^2.3.3
  printing: ^5.11.1
  bluetooth_print:
  permission_handler: 11.2.0

dependency_overrides:
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
    - assets/fonts/
    - assets/jsons/
    - assets/media/

  fonts:
    - family: Nunito-Bold
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Nunito-Light
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
    - family: Nunito-Medium
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
    - family: Nunito-Regular
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
