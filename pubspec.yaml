name: order_receiving
description: "Order Recieving Application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.14.3+28

environment:
  sdk: '>=3.2.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  http: ^1.1.2
  provider: ^6.1.1
  expandable: ^5.0.1
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.9
  awesome_snackbar_content: ^0.1.3
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.0
  dropdown_button2: ^2.3.9
  awesome_notifications: ^0.10.1
  bottom_picker: ^2.3.3

  permission_handler: ^11.3.1
  flutter_bluetooth_serial: ^0.4.0
  network_info_plus: ^4.0.2
  esc_pos_printer: ^4.1.0
  esc_pos_utils: ^1.1.0
  ping_discover_network_plus: ^0.0.5
  dart_snmp: ^3.0.1
  pdf: ^3.8.4
  path_provider: ^2.1.5

  webview_flutter: ^4.10.0

  uuid: ^4.5.0

  pdfx: ^2.8.0
  device_info_plus: ^10.1.2

  bluetooth_print: ^4.3.0
  flutter_blue_plus: ^1.35.3
  blue_thermal_printer: ^1.2.3
  pdf_render: ^1.4.12
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  riverpod_generator: ^2.6.5
  timezone: ^0.10.0
  image: ^3.3.0
  firebase_core: ^3.13.1
  firebase_crashlytics: ^4.3.6
  wakelock_plus: ^1.3.2
  bugsnag_flutter: ^4.1.2
  just_audio: ^0.10.4
  package_info_plus: ^9.0.0
  android_id: ^0.5.1

dependency_overrides:
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Nunito-Bold
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Nunito-Light
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
    - family: Nunito-Medium
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
    - family: Nunito-Regular
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf

flutter_intl:
  enabled: true
